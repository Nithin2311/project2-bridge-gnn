[project]
name = "bridgegnn"
version = "0.1.0"
description = "EHRShot bridge-diagnosis GNN prediction (CAI 5155 Project 2)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "igraph>=0.11",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "bridgedx",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gnn = ["torch>=2.4", "torch_geometric>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridgegnn"]

[tool.uv.sources]
bridgedx = { path = "../project1-bridge-dx", editable = true }

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
